name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and pytest
        # Force bash so $PYTHON_VERSION expands the same way on Windows
        # runners (whose default shell is PowerShell).
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv sync --no-dev --python "$PYTHON_VERSION"
          uv pip install pytest

      - name: Run tests
        run: uv run --no-sync pytest tests/ -p no:cacheprovider --override-ini="addopts="

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          # noinspection UndefinedParamsPresent
          python-version: "3.14"

      - name: Install development dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: uv sync

      # Run the formatters and linters through pre-commit so CI uses the exact
      # frozen revs pinned in .pre-commit-config.yaml rather than the versions
      # uv resolves from uv.lock. pre-commit's fixer hooks (ruff, docformatter)
      # rewrite files in place and exit non-zero when anything changed, which
      # makes them function as checks here.
      - name: Ruff check
        run: uv run pre-commit run --all-files ruff-check

      - name: Ruff format check
        run: uv run pre-commit run --all-files ruff-format

      - name: codespell
        run: uv run pre-commit run --all-files codespell

      - name: docformatter
        run: uv run pre-commit run --all-files docformatter

      # octowrap is a local (language: system) hook, so its version is fixed by
      # the install above either way; run its check directly.
      - name: octowrap check
        run: uv run octowrap --check .

      - name: ty
        run: uv run pre-commit run --all-files ty
