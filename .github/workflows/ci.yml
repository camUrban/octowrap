name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and pytest
        run: |
          uv sync --no-dev --python ${{ matrix.python-version }}
          uv pip install pytest

      - name: Run tests
        run: uv run --no-sync pytest tests/ -p no:cacheprovider --override-ini="addopts="

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # noinspection UndefinedParamsPresent
          python-version: "3.13"

      - name: Install development dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: codespell
        run: uv run codespell

      - name: docformatter
        run: uv run docformatter --check --diff --config ./pyproject.toml .

      - name: octowrap check
        run: uv run octowrap --check .
